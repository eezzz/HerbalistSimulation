name: BaicaoHeng
options:
  bundleIdPrefix: com.eezzz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7Z8J3QHJMS
    # ---------- 广告：上线时只改这三行（见 README“正式上线广告”） ----------
    ADS_ENABLED: "YES"                                          # NO = 完全不显示广告、不弹同意/跟踪授权
    ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"      # Google 测试应用 ID
    ADMOB_BANNER_ID: "ca-app-pub-3940256099942544/2435281174"   # Google 测试横幅 ID（Debug 构建始终用测试 ID）
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    majorVersion: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    majorVersion: 3.0.0
targets:
  BaicaoHeng:
    type: application
    platform: iOS
    sources:
      - path: BaicaoHeng
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - sdk: StoreKit.framework
      - sdk: AppTrackingTransparency.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eezzz.baicaoheng
        PRODUCT_NAME: BaicaoHeng
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: ["-ObjC"]
    info:
      path: BaicaoHeng/Info.plist
      properties:
        CFBundleDisplayName: 百草衡
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 广告
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        BHBannerUnitID: $(ADMOB_BANNER_ID)
        BHAdsEnabled: $(ADS_ENABLED)
        NSUserTrackingUsageDescription: 仅用于展示与你更相关的广告；选择不允许也不影响任何功能。
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
schemes:
  BaicaoHeng:
    build:
      targets:
        BaicaoHeng: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    archive:
      config: Release
